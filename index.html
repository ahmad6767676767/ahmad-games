<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DD Games - Speed Racer</title>
    <style>
        body {
            margin: 0;
            background-color: #000; /* Black background as requested */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevents scrollbars on full screen */
        }

        /* --- UI OVERLAYS --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Lets clicks pass through to canvas if needed */
            z-index: 10;
        }

        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        /* Front Page with Bugatti Divo Style Background */
        #front-page {
            /* Using a placeholder dark hypercar image for the Bugatti background */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1608821948842-83b54432de7f?q=80&w=1920&auto=format&fit=crop') center/cover;
        }

        h1 {
            color: #fff;
            text-shadow: 0px 0px 15px #00ffff;
            font-size: 60px;
            margin-bottom: 0;
            font-style: italic;
            text-transform: uppercase;
        }

        h3 {
            color: #00ffff;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .discord-text {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #555;
        }

        .btn-group {
            display: flex;
            gap: 20px;
        }

        button {
            background-color: #00ffff;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0px 5px 0px #008888;
            transition: 0.1s;
            text-transform: uppercase;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: 0px 0px 0px #008888;
        }

        button.shop-btn {
            background-color: #ff007f;
            box-shadow: 0px 5px 0px #880044;
        }

        /* Shop Screen */
        #shop-page {
            display: none;
            background: #111;
        }
        
        .shop-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .shop-item {
            background: #222;
            border: 2px solid #555;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 200px;
        }

        .shop-item h4 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #00ffff;
        }

        .shop-item p {
            color: #ffd700;
            font-weight: bold;
            font-size: 18px;
        }

        .shop-item button {
            padding: 10px 20px;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }

        #shop-coins {
            font-size: 30px;
            color: #ffd700;
            margin-bottom: 20px;
        }

        /* Game HUD */
        #hud {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        #speedometer {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0,0,0,0.7);
            border: 3px solid #00ffff;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 0px 15px #00ffff;
        }

        #speed-val { font-size: 36px; font-weight: bold; color: #fff; }
        #speed-unit { font-size: 16px; color: #00ffff; }

        #booster-meter {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 200px;
            height: 25px;
            background: #333;
            border: 2px solid #ff007f;
            border-radius: 10px;
            overflow: hidden;
        }

        #booster-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #ffcc00);
            transition: width 0.1s;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }

        #game-over {
            display: none;
            background: rgba(0, 0, 0, 0.9);
            flex-direction: column;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div id="ui-layer">
        <!-- Main Menu -->
        <div id="front-page" class="menu-screen">
            <h1>DD GAMES</h1>
            <h3>Made by Ahmad bin shifa</h3>
            <div class="discord-text">Discord: abs_org</div>
            <div class="btn-group">
                <button onclick="startGame()">Race</button>
                <button class="shop-btn" onclick="openShop()">Shop</button>
            </div>
        </div>

        <!-- Shop Menu -->
        <div id="shop-page" class="menu-screen">
            <h1>GARAGE</h1>
            <div id="shop-coins">Coins: 0</div>
            <div class="shop-container">
                <div class="shop-item">
                    <h4>Sports Car</h4>
                    <p>Owned</p>
                    <button id="btn-equip-default" onclick="equipCar('default')">Equipped</button>
                </div>
                <div class="shop-item">
                    <h4>Fortuner</h4>
                    <p>Price: 500</p>
                    <button id="btn-buy-fortuner" onclick="buyCar('fortuner', 500)">Buy</button>
                </div>
                <div class="shop-item">
                    <h4>BMW 3</h4>
                    <p>Price: 1000</p>
                    <button id="btn-buy-bmw" onclick="buyCar('bmw', 1000)">Buy</button>
                </div>
                <div class="shop-item">
                    <h4>Bugatti</h4>
                    <p>Price: 2000</p>
                    <button id="btn-buy-bugatti" onclick="buyCar('bugatti', 2000)">Buy</button>
                </div>
            </div>
            <br>
            <button onclick="closeShop()" style="background: #aaa; box-shadow: 0px 5px 0px #555;">Back to Menu</button>
        </div>

        <!-- Game HUD -->
        <div id="hud">
            <div class="hud-top">
                <div>Score: <span id="score">0</span></div>
                <div>Coins: <span id="hud-coins">0</span></div>
            </div>
            
            <div id="speedometer">
                <div id="speed-val">0</div>
                <div id="speed-unit">KM/H</div>
            </div>

            <div id="booster-meter">
                <div id="booster-fill"></div>
            </div>
            <div style="position: absolute; bottom: 60px; left: 30px; font-weight: bold; color: #ff007f;">NITRO (SPACE)</div>

            <div class="controls-hint">W / Up = Gas | S / Down = Brake | A / D = Steer | Space = Nitro</div>
        </div>

        <!-- Game Over -->
        <div id="game-over" class="menu-screen">
            <h1 style="color: #ff007f;">CRASHED!</h1>
            <h3 id="end-score">Score: 0</h3>
            <h3 id="end-coins" style="color: #ffd700;">Coins Earned: 0</h3>
            <div class="btn-group" style="margin-top: 20px;">
                <button onclick="startGame()">Race Again</button>
                <button class="shop-btn" onclick="backToMenu()">Main Menu</button>
            </div>
        </div>
    </div>

    <!-- The Fullscreen Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        // Resize canvas to fill screen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            roadWidth = canvas.width * 0.6; // Road takes 60% of screen
            roadLeft = (canvas.width - roadWidth) / 2;
        });

        // UI Elements
        const frontPage = document.getElementById("front-page");
        const shopPage = document.getElementById("shop-page");
        const hud = document.getElementById("hud");
        const gameOverScreen = document.getElementById("game-over");
        const bgMusic = document.getElementById("bg-music");

        // Game State
        let coins = 0;
        let score = 0;
        let gameActive = false;
        let animationId;
        
        let roadWidth = canvas.width * 0.6;
        let roadLeft = (canvas.width - roadWidth) / 2;
        let roadLines = [];
        let enemies = [];

        // Physics & Controls
        let speed = 0; // Current forward speed
        const maxSpeedNormal = 15;
        const maxSpeedBoost = 30;
        let currentMaxSpeed = maxSpeedNormal;
        
        let boosterAmount = 100;
        let isAccelerating = false;
        let isBraking = false;
        let isBoosting = false;
        let steerDir = 0;

        // Player Data & Garage
        const inventory = {
            default: true,
            fortuner: false,
            bmw: false,
            bugatti: false
        };
        let activeCarId = 'default';

        // Car Specifications
        const carSpecs = {
            default: { width: 60, height: 110, color: "#ffffff" }, // White sports car based on image
            fortuner: { width: 70, height: 130, color: "#e0e0e0" }, // Big SUV
            bmw: { width: 65, height: 115, color: "#1e90ff" }, // Sleek blue
            bugatti: { width: 75, height: 105, color: "#111111" } // Wide, dark
        };

        const player = { x: 0, y: 0, dx: 0 };

        // Input Listeners
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") isAccelerating = true;
            if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") isBraking = true;
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") steerDir = -1;
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") steerDir = 1;
            if (e.code === "Space") isBoosting = true;
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") isAccelerating = false;
            if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") isBraking = false;
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "ArrowRight" || e.key === "d" || e.key === "A" || e.key === "D") steerDir = 0;
            if (e.code === "Space") isBoosting = false;
        });

        // --- SHOP LOGIC ---
        function openShop() {
            frontPage.style.display = "none";
            shopPage.style.display = "flex";
            updateShopUI();
        }

        function closeShop() {
            shopPage.style.display = "none";
            frontPage.style.display = "flex";
        }

        function buyCar(carId, price) {
            if (coins >= price && !inventory[carId]) {
                coins -= price;
                inventory[carId] = true;
                equipCar(carId);
                updateShopUI();
            } else if (!inventory[carId]) {
                alert("Not enough coins! Race to earn more.");
            }
        }

        function equipCar(carId) {
            if (inventory[carId]) {
                activeCarId = carId;
                updateShopUI();
            }
        }

        function updateShopUI() {
            document.getElementById("shop-coins").innerText = "Coins: " + coins;
            
            const cars = ['default', 'fortuner', 'bmw', 'bugatti'];
            cars.forEach(car => {
                let btn = document.getElementById("btn-buy-" + car);
                if (!btn && car === 'default') btn = document.getElementById("btn-equip-default");
                
                if (activeCarId === car) {
                    btn.innerText = "Equipped";
                    btn.style.background = "#00ffff";
                    btn.style.color = "#000";
                } else if (inventory[car]) {
                    btn.innerText = "Equip";
                    btn.style.background = "#444";
                    btn.style.color = "#fff";
                    btn.onclick = () => equipCar(car);
                }
            });
        }

        // --- GAME LOOP ---
        function startGame() {
            frontPage.style.display = "none";
            gameOverScreen.style.display = "none";
            hud.style.display = "block";
            
            bgMusic.volume = 0.5;
            bgMusic.play();

            // Setup player position at bottom center of screen
            let specs = carSpecs[activeCarId];
            player.x = canvas.width / 2 - specs.width / 2;
            player.y = canvas.height - specs.height - 50;

            score = 0;
            speed = 0;
            boosterAmount = 100;
            roadLines = [-200, 0, 200, 400, 600, 800, 1000]; // Setup lines
            enemies = [];
            gameActive = true;

            update();
        }

        function backToMenu() {
            gameOverScreen.style.display = "none";
            frontPage.style.display = "flex";
            bgMusic.pause();
        }

        function spawnEnemy() {
            // Only spawn if moving fast enough
            if (speed < 5) return;
            
            if (Math.random() < 0.03) {
                let w = 60;
                let h = 110;
                let randomX = roadLeft + Math.floor(Math.random() * (roadWidth - w));
                enemies.push({
                    x: randomX,
                    y: -150,
                    width: w,
                    height: h,
                    color: ["#ff0000", "#ffff00", "#ff00ff"][Math.floor(Math.random() * 3)],
                    speedOffset: Math.random() * 3 + 2 // Slower than max speed so you pass them
                });
            }
        }

        function drawCarModel(x, y, type) {
            let spec = carSpecs[type];
            ctx.fillStyle = spec.color;
            ctx.fillRect(x, y, spec.width, spec.height);

            if (type === 'default') {
                // Style based on user requested image (white sports car with giant wing)
                // Red circle on side
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(x + spec.width/2, y + spec.height/2, 15, 0, Math.PI*2);
                ctx.fill();
                // Huge Black Spoiler at back
                ctx.fillStyle = "#111";
                ctx.fillRect(x - 5, y + spec.height - 15, spec.width + 10, 20);
                // Windows
                ctx.fillStyle = "#111";
                ctx.fillRect(x + 10, y + 20, spec.width - 20, 25); // Windshield
            } else if (type === 'fortuner') {
                // Large SUV styling
                ctx.fillStyle = "#333";
                ctx.fillRect(x + 5, y + 20, spec.width - 10, 30);
                ctx.fillRect(x + 5, y + 70, spec.width - 10, 40); // long roof
            } else if (type === 'bmw') {
                // Sleek dual grills
                ctx.fillStyle = "#111";
                ctx.fillRect(x + 15, y, 10, 5);
                ctx.fillRect(x + 40, y, 10, 5);
                ctx.fillRect(x + 10, y + 25, spec.width - 20, 25);
            } else if (type === 'bugatti') {
                // Orange accent strip for Bugatti Divo style
                ctx.fillStyle = "#ff6600";
                ctx.fillRect(x + spec.width/2 - 2, y, 4, spec.height);
                ctx.fillStyle = "#111";
                ctx.fillRect(x + 10, y + 20, spec.width - 20, 15);
            } else {
                // Generic enemy windows
                ctx.fillStyle = "#111";
                ctx.fillRect(x + 10, y + 20, spec.width - 20, 25);
                ctx.fillRect(x + 10, y + 70, spec.width - 20, 20);
            }
        }

        function draw() {
            // Background is strictly black outside the road
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Road (Dark gray)
            ctx.fillStyle = "#222";
            ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

            // Draw Road Borders (White/Red strips for a racing feel)
            ctx.fillStyle = "#ff0000";
            ctx.fillRect(roadLeft - 10, 0, 10, canvas.height);
            ctx.fillRect(roadLeft + roadWidth, 0, 10, canvas.height);

            // Draw Moving Road Lines (3 lanes means 2 divider lines)
            ctx.fillStyle = "#fff";
            let laneWidth = roadWidth / 3;
            for (let i = 0; i < roadLines.length; i++) {
                // Left divider
                ctx.fillRect(roadLeft + laneWidth - 5, roadLines[i], 10, 100);
                // Right divider
                ctx.fillRect(roadLeft + laneWidth * 2 - 5, roadLines[i], 10, 100);
            }

            // Draw Enemies
            for (let i = 0; i < enemies.length; i++) {
                drawCarModel(enemies[i].x, enemies[i].y, 'enemy');
            }

            // Draw Player
            let pSpec = carSpecs[activeCarId];
            drawCarModel(player.x, player.y, activeCarId);

            // Brake Lights
            if (isBraking && speed > 0) {
                ctx.fillStyle = "#ff0000"; 
                ctx.shadowBlur = 15;
                ctx.shadowColor = "red";
                ctx.fillRect(player.x + 5, player.y + pSpec.height - 10, 15, 10); 
                ctx.fillRect(player.x + pSpec.width - 20, player.y + pSpec.height - 10, 15, 10); 
                ctx.shadowBlur = 0; 
            }

            // Booster Flames
            if (isBoosting && speed > 10 && boosterAmount > 0) {
                ctx.fillStyle = "#ff8c00";
                ctx.beginPath();
                ctx.moveTo(player.x + pSpec.width / 2 - 10, player.y + pSpec.height);
                ctx.lineTo(player.x + pSpec.width / 2 + 10, player.y + pSpec.height);
                ctx.lineTo(player.x + pSpec.width / 2, player.y + pSpec.height + Math.random() * 40 + 20); // Flickering flame length
                ctx.fill();
            }
        }

        function update() {
            if (!gameActive) return;

            // --- Physics & Speed ---
            currentMaxSpeed = (isBoosting && boosterAmount > 0) ? maxSpeedBoost : maxSpeedNormal;

            if (isAccelerating) {
                speed += 0.2; // Acceleration rate
            } else if (isBraking) {
                speed -= 0.5; // Braking rate
            } else {
                speed -= 0.05; // Natural friction
            }

            // Clamp speed
            if (speed > currentMaxSpeed) speed -= 0.5; // Slowly drop back to normal max if boost ends
            if (speed < 0) speed = 0;

            // Booster drain and recharge
            if (isBoosting && isAccelerating) {
                boosterAmount -= 0.5;
                if (boosterAmount < 0) boosterAmount = 0;
            } else {
                boosterAmount += 0.1;
                if (boosterAmount > 100) boosterAmount = 100;
            }

            // Update UI Elements
            let displaySpeed = Math.floor(speed * 12); // Fake multiplier for KM/H feel
            document.getElementById("speed-val").innerText = displaySpeed;
            document.getElementById("booster-fill").style.width = boosterAmount + "%";
            document.getElementById("score").innerText = Math.floor(score);
            document.getElementById("hud-coins").innerText = coins;

            // --- Steering ---
            // You steer faster when driving faster
            let handling = (speed / maxSpeedNormal) * 8; 
            if (handling > 8) handling = 8;
            player.x += steerDir * handling;

            let pSpec = carSpecs[activeCarId];
            
            // Keep Player on the road
            if (player.x < roadLeft) player.x = roadLeft;
            if (player.x + pSpec.width > roadLeft + roadWidth) player.x = roadLeft + roadWidth - pSpec.width;

            // --- Move Environment ---
            for (let i = 0; i < roadLines.length; i++) {
                roadLines[i] += speed;
                if (roadLines[i] > canvas.height) {
                    roadLines[i] = -200; // Reset line to top
                }
            }

            // --- Enemies & Collisions ---
            for (let i = 0; i < enemies.length; i++) {
                let enemy = enemies[i];
                
                // Enemies move down screen based on your speed vs their speed
                let relativeSpeed = speed - enemy.speedOffset;
                enemy.y += relativeSpeed; 

                // Collision Detection
                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + pSpec.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + pSpec.height > enemy.y
                ) {
                    // CRASH!
                    gameActive = false;
                    
                    // Convert score to coins
                    let coinsEarned = Math.floor(score / 50);
                    coins += coinsEarned;
                    
                    document.getElementById("end-score").innerText = "Score: " + Math.floor(score);
                    document.getElementById("end-coins").innerText = "Coins Earned: " + coinsEarned;
                    
                    hud.style.display = "none";
                    gameOverScreen.style.display = "flex";
                }

                // Score points when passing an enemy
                if (enemy.y > canvas.height && !enemy.passed) {
                    score += 100;
                    enemy.passed = true;
                }
            }

            // Remove old enemies
            enemies = enemies.filter(enemy => enemy.y < canvas.height + 200);
            
            // Score constantly ticks up based on distance traveled
            score += speed * 0.05;

            spawnEnemy();
            draw();

            if (gameActive) {
                animationId = requestAnimationFrame(update);
            }
        }
    </script>
</body>
</html>
